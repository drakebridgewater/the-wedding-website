services:


  wedding:
    container_name: wedding
    build: .
    env_file: .env.dockhand
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR}/media:/app/media
    restart: unless-stopped

