services:

  wedding:
    container_name: wedding
    build: .
    image: ghcr.io/drakebridgewater/the-wedding-website:latest
    pull_policy: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - APP_PORT=${APP_PORT}
      - BRIDE_AND_GROOM=${BRIDE_AND_GROOM}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DATA_DIR=${DATA_DIR}
      - DEBUG=${DEBUG}
      - DEFAULT_WEDDING_EMAIL=${DEFAULT_WEDDING_EMAIL}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - GOOGLE_CREDENTIALS_FILE=${GOOGLE_CREDENTIALS_FILE}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - PINTEREST_BOARD_ID=${PINTEREST_BOARD_ID}
      - PINTEREST_CLIENT_ID=${PINTEREST_CLIENT_ID}
      - PINTEREST_CLIENT_SECRET=${PINTEREST_CLIENT_SECRET}
      - PINTEREST_REDIRECT_URI=${PINTEREST_REDIRECT_URI}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_USER=${POSTGRES_USER}
      - SECRET_KEY=${SECRET_KEY}
      - TICKTICK_CLIENT_ID=${TICKTICK_CLIENT_ID}
      - TICKTICK_CLIENT_SECRET=${TICKTICK_CLIENT_SECRET}
      - TICKTICK_PASSWORD=${TICKTICK_PASSWORD}
      - TICKTICK_PROJECT_NAME=${TICKTICK_PROJECT_NAME}
      - TICKTICK_USERNAME=${TICKTICK_USERNAME}
      - WEDDINGSHARE_URL=${WEDDINGSHARE_URL}
      - WEDDING_WEBSITE_URL=${WEDDING_WEBSITE_URL}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR}/media:/app/media
      - ${DATA_DIR}/data:/app/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # ── Main HTTPS router ──
      - "traefik.http.routers.wedding.rule=Host(`wedding.bridgewater.digital`) || Host(`wedding.drakebridgewater.com`)"
      - "traefik.http.routers.wedding.entryPoints=https"
      - "traefik.http.routers.wedding.tls=true"
      - "traefik.http.routers.wedding.middlewares=default-no-auth@file,wedding-canonical"
      - "traefik.http.services.wedding.loadbalancer.server.port=8080"

      # Match the entrypoint name to your static config (often "http" or "web").
      - "traefik.http.routers.wedding-http.rule=Host(`wedding.bridgewater.digital`) || Host(`wedding.drakebridgewater.com`)"
      - "traefik.http.routers.wedding-http.entryPoints=http"
      - "traefik.http.routers.wedding-http.middlewares=wedding-https-redirect"
      - "traefik.http.middlewares.wedding-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.wedding-https-redirect.redirectscheme.permanent=true"

      # Canonicalize both domains onto one 
      - "traefik.http.middlewares.wedding-canonical.redirectregex.regex=^https?://wedding\\.drakebridgewater\\.com/(.*)"
      - "traefik.http.middlewares.wedding-canonical.redirectregex.replacement=https://wedding.bridgewater.digital/$${1}"
      - "traefik.http.middlewares.wedding-canonical.redirectregex.permanent=false"
    networks:
      proxy:
        ipv4_address: 10.20.0.70
        ipv6_address: fd00:20::70

networks:
  proxy:
    external: true