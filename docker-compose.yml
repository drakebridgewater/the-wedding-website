services:
  # WARNING: If you want to use this docker-compose file in production, you need to backup your database!
  db:
    image: postgres:16
    container_name: wedding_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-wedding}
      - POSTGRES_USER=${POSTGRES_USER:-wedding}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  wedding:
    container_name: wedding
    build: .
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - POSTGRES_DB=${POSTGRES_DB:-wedding}
      - POSTGRES_USER=${POSTGRES_USER:-wedding}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./media:/app/media
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
