{% extends "base_public.html" %}
{% load django_vite %}

{% block page_head %}
{% vite_asset 'src/todos/main.tsx' %}
{% vite_asset 'src/notes/main.tsx' %}
{% endblock %}

{% block page_content %}
<div class="pt-14 max-w-3xl mx-auto px-4 py-8">
  <div class="mb-6">
    <h1 class="text-xl font-semibold text-stone-900">Planning</h1>
  </div>

  <!-- Tab bar -->
  <div class="flex gap-1 mb-6 border-b border-stone-200">
    <button id="tab-btn-todos"
      onclick="switchTab('todos')"
      class="px-4 py-2 text-sm font-medium border-b-2 transition-colors -mb-px">
      To-Dos
    </button>
    <button id="tab-btn-notes"
      onclick="switchTab('notes')"
      class="px-4 py-2 text-sm font-medium border-b-2 transition-colors -mb-px">
      Notes
    </button>
  </div>

  <div id="panel-todos">
    <div id="todos-root"
         data-drake-email="{{ drake_assignee }}"
         data-shawna-email="{{ shawna_assignee }}"></div>
  </div>
  <div id="panel-notes" style="display:none">
    <div id="notes-root"></div>
  </div>
</div>

<script>
  var ACTIVE   = 'border-stone-800 text-stone-900';
  var INACTIVE = 'border-transparent text-stone-500 hover:text-stone-700';

  function switchTab(tab) {
    ['todos', 'notes'].forEach(function(t) {
      var panel = document.getElementById('panel-' + t);
      var btn   = document.getElementById('tab-btn-' + t);
      if (t === tab) {
        panel.style.display = '';
        btn.className = 'px-4 py-2 text-sm font-medium border-b-2 transition-colors -mb-px ' + ACTIVE;
      } else {
        panel.style.display = 'none';
        btn.className = 'px-4 py-2 text-sm font-medium border-b-2 transition-colors -mb-px ' + INACTIVE;
      }
    });
    history.replaceState(null, '', location.pathname + (tab === 'todos' ? '' : '#notes'));
  }

  // Initialise from hash
  switchTab(location.hash === '#notes' ? 'notes' : 'todos');
</script>
{% endblock %}
