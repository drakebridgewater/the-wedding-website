<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <title>Drake &amp; Shawna — two interlocking hearts</title>
  <defs>
    <!-- One heart outline; box ~64x57, visual center ~ (32, 30) -->
    <path id="heart"
      d="M32 56
         C 14 41, 3 31, 3 19
         C 3 9, 14 4, 22 8
         C 27 10, 30 14, 32 19
         C 34 14, 37 10, 42 8
         C 50 4, 61 9, 61 19
         C 61 31, 50 41, 32 56 Z"/>
  </defs>

  <g fill="none" stroke="#2c2826" stroke-width="4.2"
     stroke-linejoin="round" stroke-linecap="round">
    <use href="#heart" transform="translate(13.5 27.5) scale(0.8) rotate(-15 32 30)"/>
    <use href="#heart" transform="translate(36.5 30.5) scale(0.8) rotate(15 32 30)"/>
  </g>
</svg>
